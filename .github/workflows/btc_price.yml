name: Hourly Bitcoin Price Logger

on:
  schedule:
    # Runs at the start of every hour (UTC). GitHub Actions free tier covers this easily.
    - cron: "0 * * * *"
  workflow_dispatch:   # lets you manually trigger a run from the GitHub Actions tab

# Needed so the workflow can commit the updated Excel file back to the repo
permissions:
  contents: write

jobs:
  log-btc-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests openpyxl

      - name: Fetch BTC price and update Excel file
        run: python fetch_btc_price.py

      - name: Commit and push updated file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bitcoin_price_log.xlsx
          git diff --quiet --cached || git commit -m "Update BTC price log - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
